ding:0 14px;border-radius:8px;border:var(--bw) solid var(--color-border-strong);background:var(--color-surface);color:var(--color-text);font:600 0.9375rem/1.25rem var(--font-sans);cursor:pointer\" style-hover=\"background:var(--color-sunken)\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M21 12.5l-8.5 8.5a5.5 5.5 0 0 1-7.8-7.8l9-9a3.7 3.7 0 0 1 5.2 5.2l-9 9a1.8 1.8 0 0 1-2.6-2.6l8.3-8.3\"><\u002Fpath><\u002Fsvg>Attach files<\u002Fbutton><input id=\"wf-direction-files\" type=\"file\" multiple=\"\" sc-camel-on-change=\"{{ attDirection.onChange }}\" tabindex=\"-1\" aria-hidden=\"true\" style=\"position:absolute;width:1px;height:1px;opacity:0;pointer-events:none\"><span style=\"flex:1 1 220px;min-width:0;font:400 0.8125rem/1.25rem var(--font-sans);color:var(--color-text-muted)\">Or drop files here. Text files go into the export in full; images and PDFs are listed so you can attach them in your AI tool.<\u002Fspan><\u002Fdiv><sc-if value=\"{{ attDirection.has }}\"><ul style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px\"><sc-for list=\"{{ attDirection.files }}\" as=\"fl\"><li style=\"display:flex;align-items:center;gap:12px\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\" style=\"flex:none;color:var(--color-text-muted)\"><path d=\"M14 3H6v18h12V7z\"><\u002Fpath><path d=\"M14 3v4h4\"><\u002Fpath><\u002Fsvg><span style=\"flex:1;min-width:0;display:flex;flex-direction:column\"><span style=\"font:500 0.9375rem/1.375rem var(--font-sans);overflow-wrap:anywhere\">{{ fl.name }}<\u002Fspan><span style=\"font:400 0.75rem/1rem var(--font-mono);color:var(--color-text-muted)\">{{ fl.meta }}<\u002Fspan><\u002Fspan><button type=\"button\" sc-camel-on-click=\"{{ fl.onRemove }}\" aria-label=\"{{ fl.aria }}\" style=\"flex:none;min-height:44px;padding:0 8px;border:0;background:transparent;color:var(--color-text-muted);font:500 0.875rem/1.25rem var(--font-sans);cursor:pointer;text-decoration:underline;text-underline-offset:3px\" style-hover=\"color:var(--color-error)\">Remove<\u002Fbutton><\u002Fli><\u002Fsc-for><\u002Ful><\u002Fsc-if><sc-if value=\"{{ attDirection.hasMsg }}\"><span role=\"status\" style=\"font:500 0.8125rem/1.25rem var(--font-sans);color:var(--color-error)\">{{ attDirection.msg }}<\u002Fspan><\u002Fsc-if><span style=\"font:600 0.875rem/1.25rem var(--font-sans);margin-top:4px\">When should the anti-slop rules run?<\u002Fspan><div role=\"group\" aria-label=\"When the anti-slop rules run\" style=\"display:flex;flex-wrap:wrap;gap:8px\"><sc-for list=\"{{ wfTiming }}\" as=\"o\"><button type=\"button\" aria-pressed=\"{{ o.pressed }}\" sc-camel-on-click=\"{{ o.onClick }}\" style=\"display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:8px;border:var(--bw) solid {{ o.border }};background:{{ o.bg }};color:{{ o.fg }};font:500 0.9375rem/1.25rem var(--font-sans);cursor:pointer;transition:background 160ms var(--ease),color 160ms var(--ease)\">{{ o.l }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:2px;margin-top:12px\"><span style=\"font:600 0.875rem/1.25rem var(--font-sans)\">Personality settings<\u002Fspan><span style=\"font:400 0.875rem/1.25rem var(--font-sans);color:var(--color-text-muted)\">1 is calm, 3 is bold.<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:16px;margin-top:4px\"><sc-for list=\"{{ wfDials }}\" as=\"dl\"><div role=\"group\" aria-label=\"{{ dl.aria }}\" style=\"display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px 16px\"><span style=\"display:flex;flex-direction:column;gap:2px;min-width:0\"><span style=\"font:600 0.9375rem/1.375rem var(--font-sans)\">{{ dl.n }}<\u002Fspan><span style=\"font:400 0.875rem/1.25rem var(--font-sans);color:var(--color-text-muted)\">{{ dl.t }}<\u002Fspan><\u002Fspan><div style=\"display:grid;grid-template-columns:repeat(3,44px);gap:6px\"><sc-for list=\"{{ dl.opts }}\" as=\"o\"><button type=\"button\" aria-pressed=\"{{ o.pressed }}\" aria-label=\"{{ o.aria }}\" sc-camel-on-click=\"{{ o.onClick }}\" style=\"display:inline-flex;align-items:center;justify-content:center;width:44px;min-height:44px;padding:0;border-radius:8px;border:var(--bw) solid {{ o.border }};background:{{ o.bg }};color:{{ o.fg }};font:500 0.9375rem/1.25rem var(--font-mono);cursor:pointer;transition:background 160ms var(--ease),color 160ms var(--ease)\">{{ o.v }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv><\u002Fdiv><\u002Fsc-for><\u002Fdiv><\u002Fdiv><\u002Fli>\n          <\u002Fol>\n          <div style=\"display:flex;flex-direction:column;gap:40px;padding-top:16px\">\n            <div style=\"display:flex;flex-direction:column;gap:4px\"><h3 style=\"margin:0;font:600 1.25rem/1.75rem var(--font-sans)\">Shared answers<\u002Fh3><p style=\"margin:0;font:400 0.9375rem/1.5rem var(--font-sans);color:var(--color-text-muted)\">These come up in several steps. Answer once here and every step that needs them is filled in.<\u002Fp><\u002Fdiv>\n            <sc-for list=\"{{ wfShGroups }}\" as=\"g\" hint-placeholder-count=\"3\">\n              <fieldset style=\"border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:16px;min-width:0\">\n                <legend style=\"padding:0;margin:0 0 8px;font:600 1rem/1.5rem var(--font-sans)\">{{ g.t }}<\u002Flegend>\n                <sc-if value=\"{{ g.hasNote }}\"><p style=\"margin:-8px 0 0;font:400 0.875rem/1.25rem var(--font-sans);color:var(--color-text-muted)\">{{ g.note }}<\u002Fp><\u002Fsc-if>\n                <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:24px\">\n                  <sc-for list=\"{{ g.fields }}\" as=\"f\">\n                    <div style=\"display:flex;flex-direction:column;gap:6px;min-width:0\">\n                      <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px\"><label for=\"{{ f.id }}\" style=\"font:600 0.9375rem/1.25rem var(--font-sans)\">{{ f.label }}<\u002Flabel><sc-if value=\"{{ f.req }}\"><span style=\"font:500 0.75rem/1rem var(--font-sans);padding:2px 8px;border-radius:999px;background:var(--color-accent-soft);color:var(--color-accent)\">Required<\u002Fspan><\u002Fsc-if><\u002Fdiv>\n                      <sc-if value=\"{{ f.long }}\"><textarea id=\"{{ f.id }}\" rows=\"2\" value=\"{{ f.value }}\" sc-camel-on-change=\"{{ f.onChange }}\" sc-camel-on-blur=\"{{ f.onBlur }}\" aria-invalid=\"{{ f.invalid }}\" aria-describedby=\"{{ f.describedby }}\" placeholder=\"{{ f.ex }}\" style=\"width:100%;min-height:44px;padding:10px 12px;border-radius:8px;border-style:solid;border-width:{{ f.bwid }};border-color:{{ f.border }};background:var(--color-surface);color:var(--color-text);font:400 1rem/1.5rem var(--font-sans);resize:vertical\"><\u002Ftextarea><\u002Fsc-if>\n                      <sc-if value=\"{{ f.short }}\"><input id=\"{{ f.id }}\" type=\"text\" value=\"{{ f.value }}\" sc-camel-on-change=\"{{ f.onChange }}\" sc-camel-on-blur=\"{{ f.onBlur }}\" aria-invalid=\"{{ f.invalid }}\" aria-describedby=\"{{ f.describedby }}\" placeholder=\"{{ f.ex }}\" style=\"width:100%;min-height:44px;padding:10px 12px;border-radius:8px;border-style:solid;border-width:{{ f.bwid }};border-color:{{ f.border }};background:var(--color-surface);color:var(--color-text);font:400 1rem/1.5rem var(--font-sans)\"><\u002Fsc-if>\n                      <sc-if value=\"{{ f.hasErr }}\"><p id=\"{{ f.errId }}\" style=\"margin:0;display:flex;gap:6px;align-items:flex-start;font:500 0.875rem/1.25rem var(--font-sans);color:var(--color-error)\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\" style=\"flex:none;margin-top:2px\"><path d=\"M12 3l10 18H2z\"><\u002Fpath><path d=\"M12 10v5\"><\u002Fpath><path d=\"M12 18v.01\"><\u002Fpath><\u002Fsvg>{{ f.err }}<\u002Fp><\u002Fsc-if>\n                      <span style=\"font:400 0.75rem/1rem var(--font-sans);color:var(--color-text-muted)\">{{ f.use }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Ffieldset>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsection>\n        <section id=\"wf-steps\" aria-labelledby=\"h-steps\" style=\"display:flex;flex-direction:column;gap:24px\">\n          <div style=\"display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px\">\n            <div style=\"display:flex;flex-direction:column;gap:4px;max-width:64ch\">\n              <h2 id=\"h-steps\" style=\"margin:0;font:600 1.5rem/2rem var(--font-sans)\">The 25 steps, in order<\u002Fh2>\n              <p style=\"margin:0;color:var(--color-text-muted)\">Open a step to add details only that step needs. Every field here is optional. Untick a step to leave it out.<\u002Fp>\n            <\u002Fdiv>\n            <button type=\"button\" sc-camel-on-click=\"{{ wfToggleAll }}\" style=\"white-space:nowrap;min-height:44px;padding:0 12px;border:0;background:transparent;color:var(--color-primary);font:600 0.9375rem/1.5rem var(--font-sans);cursor:pointer;text-decoration:underline;text-underline-offset:3px\">{{ wfAllLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n          <sc-if value=\"{{ notLoaded }}\" hint-placeholder-val=\"{{ false }}\"><div aria-hidden=\"true\" style=\"height:240px;border-radius:12px;background:var(--color-sunken)\"><\u002Fdiv><\u002Fsc-if>\n          <ol class=\"phase-timeline\" style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:24px\">\n            <sc-for list=\"{{ wfFlow }}\" as=\"ph\" hint-placeholder-count=\"8\">\n              <li class=\"phase-block\" style=\"border-radius:12px;border:var(--bw) solid var(--color-border);background:var(--color-surface);overflow:hidden\">\n                <div style=\"display:flex;flex-direction:column;gap:4px;padding:24px;border-bottom:var(--bw) solid var(--color-border)\">\n                  <p style=\"margin:0;font:500 0.8125rem/1.25rem var(--font-mono);color:var(--color-accent)\">{{ ph.label }} · {{ ph.countLabel }}<\u002Fp>\n                  <h3 style=\"margin:0;font:600 1.25rem/1.75rem var(--font-sans)\">{{ ph.title }}<\u002Fh3>\n                  <p style=\"margin:0;color:var(--color-text-muted)\">{{ ph.goal }}<\u002Fp>\n                <\u002Fdiv>\n                <ol style=\"list-style:none;margin:0;padding:0\">\n                  <sc-for list=\"{{ ph.items }}\" as=\"p\">\n                    <li style=\"border-bottom:var(--bw) solid var(--color-border)\">\n                      <div style=\"display:flex;align-items:center;gap:4px;padding:8px 16px 8px 12px\">\n                        <label style=\"flex:none;display:flex;align-items:center;justify-content:center;width:44px;height:44px;cursor:pointer\"><input type=\"checkbox\" checked=\"{{ p.inc }}\" sc-camel-on-change=\"{{ p.onInc }}\" aria-label=\"{{ p.incAria }}\" style=\"width:20px;height:20px;margin:0;accent-color:var(--color-primary);cursor:pointer\"><\u002Flabel>\n                        <button type=\"button\" aria-expanded=\"{{ p.expanded }}\" aria-controls=\"{{ p.panelId }}\" sc-camel-on-click=\"{{ p.onToggle }}\" style=\"flex:1;min-width:0;display:flex;align-items:center;gap:16px;min-height:64px;padding:12px 8px 12px 12px;border:0;border-radius:8px;background:transparent;color:var(--color-text);text-align:left;cursor:pointer;opacity:{{ p.op }};transition:background 160ms var(--ease),opacity 200ms var(--ease)\" style-hover=\"background:var(--color-sunken)\">\n                          <span style=\"flex:none;white-space:nowrap;min-width:64px;align-self:flex-start;font:500 0.8125rem/1.5rem var(--font-mono);color:var(--color-text-muted)\">{{ p.stepLabel }}<\u002Fspan>\n                          <span style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:4px\"><span style=\"font:600 1rem/1.5rem var(--font-sans)\">{{ p.title }}<\u002Fspan><span style=\"font:400 0.875rem/1.25rem var(--font-sans);color:var(--color-text-muted)\">{{ p.use }}<\u002Fspan><\u002Fspan>\n                          \n                          <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\" style=\"flex:none;color:var(--color-text-muted);transform:{{ p.rot }};transition:transform 240ms var(--ease)\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg>\n                        <\u002Fbutton>\n                      <\u002Fdiv>\n                      <sc-if value=\"{{ p.open }}\">\n                        <div id=\"{{ p.panelId }}\" style=\"display:flex;flex-direction:column;gap:24px;margin:0;padding:8px clamp(16px,3vw,24px) 24px clamp(16px,6vw,72px);animation:wfIn 240ms var(--ease)\">\n                          \n                          <sc-if value=\"{{ p.hasFields }}\"><div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:24px 32px\">\n                            <sc-for list=\"{{ p.fields }}\" as=\"f\">\n                              <div style=\"display:flex;flex-direction:column;gap:6px;min-width:0\">\n                                <label for=\"{{ f.id }}\" style=\"font:600 0.9375rem/1.25rem var(--font-sans)\">{{ f.label }}<\u002Flabel>\n                                <sc-if value=\"{{ f.long }}\"><textarea id=\"{{ f.id }}\" rows=\"3\" value=\"{{ f.value }}\" sc-camel-on-change=\"{{ f.onChange }}\" placeholder=\"{{ f.hint }}\" style=\"width:100%;min-height:44px;padding:10px 12px;border-radius:8px;border-style:solid;border-width:var(--bw);border-color:var(--color-border-strong);background:var(--color-surface);color:var(--color-text);font:400 1rem/1.5rem var(--font-sans);resize:vertical\"><\u002Ftextarea><\u002Fsc-if>\n                                <sc-if value=\"{{ f.short }}\"><input id=\"{{ f.id }}\" type=\"text\" value=\"{{ f.value }}\" sc-camel-on-change=\"{{ f.onChange }}\" placeholder=\"{{ f.hint }}\" style=\"width:100%;min-height:44px;padding:10px 12px;border-radius:8px;border-style:solid;border-width:var(--bw);border-color:var(--color-border-strong);background:var(--color-surface);color:var(--color-text);font:400 1rem/1.5rem var(--font-sans)\"><\u002Fsc-if>\n                              <\u002Fdiv>\n                            <\u002Fsc-for>\n                          <\u002Fdiv><\u002Fsc-if>\n                          <sc-if value=\"{{ p.noFields }}\"><p style=\"margin:0;font:400 0.9375rem/1.5rem var(--font-sans);color:var(--color-text-muted)\">Nothing else needed. This step uses your answers above.<\u002Fp><\u002Fsc-if>\n                          <div style=\"display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:8px 16px\">\n                            <sc-if value=\"{{ p.hasFields }}\"><button type=\"button\" sc-camel-on-click=\"{{ p.onClearStep }}\" style=\"white-space:nowrap;min-height:44px;padding:0 12px;border:0;background:transparent;color:var(--color-text-muted);font:500 0.9375rem/1.5rem var(--font-sans);cursor:pointer;text-decoration:underline;text-underline-offset:3px\">Clear this step<\u002Fbutton><\u002Fsc-if>\n                            <button type=\"button\" sc-camel-on-click=\"{{ p.onCopyStep }}\" style=\"white-space:nowrap;min-height:44px;padding:0 16px;border-radius:8px;border:var(--bw) solid var(--color-border-strong);background:var(--color-surface);color:var(--color-text);font:600 0.9375rem/1.5rem var(--font-sans);cursor:pointer\" style-hover=\"background:var(--color-sunken)\">Copy this step only<\u002Fbutton>\n                          <\u002Fdiv>\n                        <\u002Fdiv>\n                      <\u002Fsc-if>\n                    <\u002Fli>\n                  <\u002Fsc-for>\n                <\u002Fol>\n                <dl style=\"margin:0;padding:16px 24px 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:16px 24px;background:var(--color-sunken);font:400 0.875rem/1.25rem var(--font-sans)\">\n                  <div style=\"display:flex;flex-direction:column;gap:4px\"><dt style=\"font-weight:600\">Carry forward<\u002Fdt><dd style=\"margin:0;color:var(--color-text-muted)\">{{ ph.carry }}<\u002Fdd><\u002Fdiv>\n                  <div style=\"display:flex;flex-direction:column;gap:4px\"><dt style=\"font-weight:600\">Tip<\u002Fdt><dd style=\"margin:0;color:var(--color-text-muted)\">{{ ph.tip }}<\u002Fdd><\u002Fdiv>\n                <\u002Fdl>\n              <\u002Fli>\n            <\u002Fsc-for>\n          <\u002Fol>\n        <\u002Fsection>\n        <section id=\"wf-output\" tabindex=\"-1\" aria-labelledby=\"h-output\" style=\"display:flex;flex-direction:column;gap:24px\">\n          <div style=\"display:flex;flex-direction:column;gap:4px\">\n            <h2 id=\"h-output\" style=\"margin:0;font:600 1.5rem/2rem var(--font-sans)\">Check and export<\u002Fh2>\n            <p style=\"margin:0;color:var(--color-text-muted);max-width:64ch\">The file is checked against the anti-slop rules as you type. Em dashes are fixed for you; everything else is yours to rewrite.<\u002Fp>\n          <\u002Fdiv>\n          <ul style=\"list-style:none;margin:0;padding:0;border-top:var(--bw) solid var(--color-border)\">\n            <sc-for list=\"{{ wfLint }}\" as=\"x\" hint-placeholder-count=\"6\"><li style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px;padding:12px 0;border-bottom:var(--bw) solid var(--color-border)\"><span style=\"flex:none;width:64px;text-align:center;font:600 0.75rem/1.25rem var(--font-mono);padding:2px 0;border-radius:999px;color:{{ x.fg }};background:{{ x.bg }}\">{{ x.pill }}<\u002Fspan><span style=\"flex:1 1 300px;min-width:0;display:flex;flex-direction:column\"><strong style=\"font:600 0.9375rem/1.5rem var(--font-sans)\">{{ x.t }}<\u002Fstrong><span style=\"font:400 0.875rem/1.25rem var(--font-sans);color:var(--color-text-muted);overflow-wrap:anywhere\">{{ x.dt }}<\u002Fspan><\u002Fspan><\u002Fli><\u002Fsc-for>\n          <\u002Ful>\n          <div class=\"code-window\" style=\"border-radius:12px;overflow:hidden;border:var(--bw) solid var(--color-border);background:var(--code-bg)\">\n            <div style=\"display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding:8px 8px 8px 16px;background:var(--code-bar);color:var(--code-muted);font:500 0.8125rem/1.25rem var(--font-mono)\"><span style=\"overflow-wrap:anywhere\">{{ wfFile }} · {{ wfMeta }}<\u002Fspan><span style=\"display:flex;gap:8px\"><button type=\"button\" sc-camel-on-click=\"{{ wfDownload }}\" style=\"min-height:40px;padding:0 12px;border-radius:6px;border:1px solid var(--code-muted);background:transparent;color:var(--code-fg);font:500 0.8125rem/1.25rem var(--font-sans);cursor:pointer\">Download<\u002Fbutton><button type=\"button\" sc-camel-on-click=\"{{ wfCopy }}\" style=\"min-height:40px;padding:0 12px;border-radius:6px;border:1px solid var(--code-head);background:var(--code-head);color:var(--code-filled-fg);font:600 0.8125rem/1.25rem var(--font-sans);cursor:pointer\">Copy<\u002Fbutton><\u002Fspan><\u002Fdiv>\n            <pre tabindex=\"0\" aria-label=\"Workflow file preview\" style=\"margin:0;padding:16px;max-height:560px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;font:400 0.8125rem/1.375rem var(--font-mono);color:var(--code-fg)\">{{ wfMd }}<\u002Fpre>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fdiv>\n      <aside class=\"side-column\" aria-labelledby=\"h-wf-file\" style=\"flex:1 1 300px;min-width:0;display:flex;flex-direction:column\" n style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:2px\"><span style=\"display:flex;justify-content:space-between;gap:8px;font:600 0.9375rem/1.25rem var(--font-sans)\">{{ o.l }}<span style=\"flex:none;font:500 0.75rem/1.25rem var(--font-mono);color:var(--color-text-muted)\">{{ o.size }}<\u002Fspan><\u002Fspan><span style=\"font:400 0.8125rem/1.25rem var(--font-sans);color:var(--color-text-muted)\">{{ o.t }}<\u002Fspan><\u002Fspan>\n              <\u002Flabel>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <button type=\"button\" sc-camel-on-click=\"{{ wfCopy }}\" style=\"display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:8px;border:var(--bw) solid var(--color-primary);background:var(--color-primary);color:var(--color-on-primary);font:600 1rem/1.5rem var(--font-sans);cursor:pointer\" style-hover=\"background:var(--color-primary-hover)\"><sc-if value=\"{{ wfCopied }}\">Copied<\u002Fsc-if><sc-if value=\"{{ wfNotCopied }}\" hint-placeholder-val=\"{{ true }}\">Copy full markdown<\u002Fsc-if><\u002Fbutton>\n            <button type=\"button\" sc-camel-on-click=\"{{ wfDownload }}\" style=\"min-height:48px;padding:0 20px;border-radius:8px;border:var(--bw) solid var(--color-border-strong);background:var(--color-surface);color:var(--color-text);font:600 1rem/1.5rem var(--font-sans);cursor:pointer\" style-hover=\"background:var(--color-sunken)\">Download .md<\u002Fbutton>\n            <div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px\">\n              <button type=\"button\" sc-camel-on-click=\"{{ wfPreview }}\" style=\"min-height:44px;padding:0;border:0;background:transparent;color:var(--color-primary);font:600 0.9375rem/1.5rem var(--font-sans);cursor:pointer;text-decoration:underline;text-underline-offset:3px\">Check and preview<\u002Fbutton>\n              <button type=\"button\" sc-camel-on-click=\"{{ wfReset }}\" style=\"min-height:44px;padding:0;border:0;background:transparent;color:var(--color-text-muted);font:500 0.9375rem/1.5rem var(--font-sans);cursor:pointer;text-decoration:underline;text-underline-offset:3px\">Clear all answers<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"margin:0;font:400 0.8125rem/1.25rem var(--font-sans);color:var(--color-text-muted)\">Saved on this device as you type. Paste the file into Claude, ChatGPT, Cursor or any AI tool, then say \"start\".<\u002Fp>\n        <\u002Fdiv>\n      <\u002Faside>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ faqPage }}\" hint-placeholder-val=\"{{ false }}\">\n  <div class=\"page-faq\" style=\"max-width:1200px;margin:0 auto;padding:24px clamp(16px,4vw,32px) clamp(64px,8vw,96px)\">\n    <nav class=\"breadcrumbs\" aria-label=\"Breadcrumb\"><ol style=\"display:flex;flex-wrap:wrap;align-items:center;gap:0 8px;list-style:none;margin:0 0 16px;padding:0;font:400 0.875rem/1.25rem var(--font-sans);color:var(--color-text-muted)\"><li><a href=\"#/\" style=\"display:inline-flex;align-items:center;min-height:44px;color:var(--color-primary)\">Home<\u002Fa><\u002Fli><li aria-hidden=\"true\" style=\"font-family:var(--font-mono)\">/<\u002Fli><li aria-current=\"page\" style=\"color:var(--color-text)\">FAQ<\u002Fli><\u002Fol><\u002Fnav>\n    <header class=\"page-heading\" style=\"display:flex;flex-direction:column;gap:8px;max-width:720px;margin-bottom:40px\">\n      <h1 id=\"page-title\" tabindex=\"-1\" style=\"margin:0;font:600 clamp(2rem,4vw,2.5rem)/1.2 var(--font-sans);letter-spacing:-0.02em;text-wrap:balance\">Questions, answered in plain words<\u002Fh1>\n      <p style=\"margin:0;font:400 1.125rem/1.75rem var(--font-sans);color:var(--color-text-muted);text-wrap:pretty\">How the site works, how to build a project with it, and what happens to your answers. No coding knowledge needed.<\u002Fp>\n    <\u002Fheader>\n    <section aria-labelledby=\"h-faq-how\" style=\"display:flex;flex-direction:column;gap:20px;margin-bottom:64px\">\n      <h2 id=\"h-faq-how\" style=\"margin:0;font:600 1.25rem/1.75rem var(--font-sans)\">The whole process in four steps<\u002Fh2>\n      <ol style=\"list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:24px 32px\">\n        <li style=\"display:flex;flex-direction:column;gap:6px;padding-top:16px;border-top:2px solid var(--color-accent)\"><span style=\"font:500 0.875rem/1.25rem var(--font-mono);color:var(--color-accent)\">01<\u002Fspan><strong style=\"font:600 1.0625rem/1.5rem var(--font-sans)\">Answer a few questions<\u002Fstrong><span style=\"font:400 0.9375rem/1.5rem var(--font-sans);color:var(--color-text-muted)\">On the Workflow page, describe your project. Only three answers are required.<\u002Fspan><\u002Fli>\n        <li style=\"display:flex;flex-direction:column;gap:6px;padding-top:16px;border-top:2px solid var(--color-border-strong)\"><span style=\"font:500 0.875rem/1.25rem var(--font-mono);color:var(--color-text-muted)\">02<\u002Fspan><strong style=\"font:600 1.0625rem/1.5rem var(--font-sans)\">Pick your steps and rules<\u002Fstrong><span style=\"font:400 0.9375rem/1.5rem var(--font-sans);color:var(--color-text-muted)\">Keep all 25 steps or untick the ones you don't need. Choose how many anti-slop rules to attach.<\u002Fspan><\u002Fli>\n        <li style=\"display:flex;flex-direction:column;gap:6px;padding-top:16px;border-top:2px solid var(--color-border-strong)\"><span style=\"font:500 0.875rem/1.25rem var(--font-mono);color:var(--color-text-muted)\">03<\u002Fspan><strong style=\"font:600 1.0625rem/1.5rem var(--font-sans)\">Copy or download one file<\u002Fstrong><span style=\"font:400 0.9375rem/1.5rem var(--font-sans);color:var(--color-text-muted)\">Everything lands in a single text file, checked against the rules as you type.<\u002Fspan><\u002Fli>\n        <li style=\"display:flex;flex-direction:column;gap:6px;padding-top:16px;border-top:2px solid var(--color-border-strong)\"><span style=\"font:500 0.875rem/1.25rem var(--font-mono);color:var(--color-text-muted)\">04<\u002Fspan><strong style=\"font:600 1.0625rem/1.5rem var(--font-sans)\">Paste it and say \"start\"<\u002Fstrong><span style=\"font:400 0.9375rem/1.5rem var(--font-sans);color:var(--color-text-muted)\">Open Claude, ChatGPT or any AI chat, paste the file, and the AI works through it one step at a time.<\u002Fspan><\u002Fli>\n      <\u002Fol>\n      <a href=\"#/workflow\" style=\"align-self:flex-start;display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 20px;border-radius:8px;background:var(--color-primary);color:var(--color-on-primary);font:600 1rem/1.5rem var(--font-sans);text-decoration:none\" style-hover=\"background:var(--color-primary-hover)\">Start the workflow<svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M5 12h14\"><\u002Fpath><path d=\"M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fa>\n    <\u002Fsection>\n    <div style=\"display:flex;flex-wrap:wrap;gap:48px;align-items:flex-start\">\n      <div style=\"flex:3 1 600px;min-width:0;display:flex;flex-direction:column;gap:32px\">\n        <div style=\"display:flex;flex-direction:column;gap:16px\">\n          <label for=\"faq-search\" style=\"font:600 1rem/1.5rem var(--font-sans)\">Search the questions<\u002Flabel>\n          <div style=\"position:relative\">\n            <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\" style=\"position:absolute;left:14px;top:14px;color:var(--color-text-muted);pointer-events:none\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"M20 20l-3.5-3.5\
